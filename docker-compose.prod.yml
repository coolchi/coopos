# Production on MP-Main: host network (iptables:false), bind Apache on 8088.
# Only coopos-* containers. DB via 127.0.0.1 (existing coopos MySQL user).
services:
  app:
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    networks: !reset []
    environment:
      DB_HOST: "127.0.0.1"
      APP_PORT_INTERNAL: "8088"
      TRUSTED_PROXIES: "*"
      CONTAINER_ROLE: app
    volumes:
      - /home/forge/coopos.ng/storage:/var/www/html/storage
  queue:
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    networks: !reset []
    environment:
      DB_HOST: "127.0.0.1"
      CONTAINER_ROLE: queue
    volumes:
      - /home/forge/coopos.ng/storage:/var/www/html/storage
  scheduler:
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    networks: !reset []
    environment:
      DB_HOST: "127.0.0.1"
      CONTAINER_ROLE: scheduler
    volumes:
      - /home/forge/coopos.ng/storage:/var/www/html/storage
